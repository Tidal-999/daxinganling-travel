    --ink:#232733;--mut:#6b7280;--bg:#f4f1ec;--card:#ffffff;--line:#e7e1d8;
    --red:#c0352e;--orange:#e0522a;--tra:#2563eb;--sight:#16a34a;--food:#ea580c;
    --shop:#db2777;--stay:#7c3aed;--move:#64748b;--hot:#dc2626;--warn:#b45309;
  }
  html{scroll-behavior:smooth;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;font-size:14px;padding-bottom:76px;}
  #app{max-width:540px;margin:0 auto;}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#e0522a,#c0352e 55%,#8f2d2d);
    color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;box-shadow:0 3px 12px rgba(192,53,46,.28);}
  .h-top{display:flex;align-items:center;gap:8px;}
  header h1{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.5px;}
  #app-sub{font-size:12px;opacity:.92;margin-top:4px;}
  .h-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .h-btn.on{background:#fff;color:var(--red);border-color:#fff;font-weight:600;}
  nav.tabs{position:sticky;top:0;z-index:19;display:flex;background:#fff;border-bottom:1px solid var(--line);}
  nav.tabs button{flex:1;border:0;background:none;padding:11px 2px 9px;font-size:12px;color:var(--mut);
    border-bottom:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  nav.tabs button .ic{font-size:17px;line-height:1;}
  nav.tabs button.on{color:var(--red);border-bottom-color:var(--red);font-weight:600;}
  main{padding:14px 14px 30px;}
  .sec{margin-bottom:16px;}
  .sec>h2{font-size:15px;display:flex;align-items:center;gap:7px;margin:4px 2px 9px;}
  .sec>h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--sight);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    box-shadow:0 2px 8px rgba(31,36,48,.05);margin-bottom:12px;}
  .card h3{font-size:14px;margin-bottom:6px;}
  .row{font-size:13px;display:flex;gap:7px;align-items:baseline;}
  .row b{color:var(--tra);white-space:nowrap;}
  .note{font-size:12px;color:var(--mut);margin-top:6px;}
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 2px 10px rgba(31,36,48,.06);margin-bottom:14px;}
  .day-head{display:flex;align-items:center;gap:12px;padding:12px 15px;color:#fff;}
  .d1{background:linear-gradient(120deg,#2563eb,#1d4ed8);}
  .d2{background:linear-gradient(120deg,#16a34a,#15803d);}
  .d3{background:linear-gradient(120deg,#ea580c,#c2410c);}
  .d4{background:linear-gradient(120deg,#7c3aed,#6d28d9);}
  .d5{background:linear-gradient(120deg,#db2777,#be185d);}
  .d6{background:linear-gradient(120deg,#0d9488,#0f766e);}
  .d7{background:linear-gradient(120deg,#64748b,#475569);}
  .day-head .dt{font-size:17px;font-weight:700;letter-spacing:1px;}
  .day-head .ds{font-size:11.5px;opacity:.92;margin-top:1px;}
  .day-head .theme{margin-left:auto;font-size:11.5px;text-align:right;opacity:.95;}
  .tl{position:relative;padding:4px 0;}
  .item{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:9px 15px;position:relative;}
  .item::before{content:"";position:absolute;left:80px;top:0;bottom:0;width:2px;background:var(--line);}
  .item:first-child::before{top:24px;}
  .item:last-child::before{bottom:auto;height:24px;}
  .item .time{font-weight:700;color:#334155;font-size:12.5px;text-align:right;padding-top:1px;}
  .item .ttl{font-size:13.5px;font-weight:600;}
  .item .desc{font-size:12.5px;color:#4b5563;margin-top:2px;}
  .item .dot{position:absolute;left:75px;top:13px;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--card);z-index:1;}
  .tag{display:inline-block;border-radius:6px;padding:0 7px;font-size:10.5px;color:#fff;margin-right:6px;vertical-align:1px;}
  .t-tra{background:var(--tra);}.t-sight{background:var(--sight);}.t-food{background:var(--food);}
  .t-shop{background:var(--shop);}.t-stay{background:var(--stay);}.t-move{background:var(--move);}
  .urgent{border:1px solid #fca5a5;background:#fef2f2;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:10px;}
  .urgent b{color:var(--hot);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;}
  th{background:#faf7f2;font-weight:600;white-space:nowrap;}
  ul.tips{margin:0;}
  ul.tips li{margin:4px 0 4px 17px;font-size:12.5px;color:#4b5563;}
  .list-row{display:flex;align-items:flex-start;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px;}
  .list-row:last-child{border-bottom:0;}
  .list-row input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--red);flex:none;}
  .list-row.done .bk-t{text-decoration:line-through;color:var(--mut);}
  .bk-t{flex:1;min-width:0;}
  .bk-u{flex:none;font-size:10px;color:var(--hot);border:1px solid #fca5a5;border-radius:6px;padding:0 5px;}
  .map-drawer{margin:2px 12px 10px;}
  .map-drawer summary{cursor:pointer;font-size:12.5px;font-weight:600;color:#475569;padding:7px 10px;background:#f6f1e9;border-radius:9px;list-style:none;user-select:none;}
  .map-drawer summary::-webkit-details-marker{display:none;}
  .map-drawer[open] summary{margin-bottom:8px;}
  .map-drawer svg{display:block;}
  /* edit mode */
  .edit-note{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:10px;
    padding:8px 12px;font-size:12px;margin-bottom:12px;}
  .inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;
    font-family:inherit;background:#fcfbf9;color:var(--ink);}
  .inp:focus{outline:2px solid #c7d2fe;border-color:#818cf8;}
  .ta{min-height:44px;resize:vertical;}
  .edit-block{display:flex;flex-direction:column;gap:6px;padding:8px 2px;border-bottom:1px dashed var(--line);}
  .edit-block:last-child{border-bottom:0;}
  .edit-head{display:flex;gap:6px;}
  .edit-head input{flex:1;}
  .mini{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;
    font-size:12px;cursor:pointer;color:#444;}
  .mini.danger{color:var(--hot);border-color:#fecaca;background:#fef2f2;}
  .mini.ok{color:var(--sight);border-color:#bbf7d0;background:#f0fdf4;}
  .add-btn{width:100%;margin-top:6px;border:1.5px dashed #c7b8a8;background:transparent;color:#8a6b52;
    border-radius:10px;padding:8px;font-size:13px;cursor:pointer;}
  .add-btn:active{background:#f6efe6;}
  .day-edit{margin:10px 12px;display:flex;flex-direction:column;gap:6px;}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .mask.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px)+18px);
    animation:up .18s ease;}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:15px;margin-bottom:10px;}
  .sheet button{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;background:#fff;font-size:14px;margin-bottom:8px;cursor:pointer;}
  .sheet button:active{background:#f6f1ea;}
  .sheet .x{float:right;border:0;background:#f1ece4;width:28px;height:28px;border-radius:50%;text-align:center;
    font-size:14px;cursor:pointer;padding:0;margin:0;}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(30,30,40,.92);color:#fff;
    padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;}
  .toast.show{opacity:1;}
  .kpi{display:flex;gap:8px;margin-bottom:12px;}
  .kpi .card{flex:1;text-align:center;margin:0;}
  .kpi .n{font-size:17px;font-weight:700;color:var(--red);}
  .kpi .l{font-size:11px;color:var(--mut);}
  .bottom-fab{position:fixed;right:16px;bottom:84px;z-index:30;display:none;}
  .bottom-fab.show{display:block;}
</style>
</head>

<div id="app">
  <header>
    <div class="h-top">
      <h1 id="app-title">大兴安岭赏秋攻略</h1>
      <button class="h-btn" id="btn-data">⚙ 数据</button>
      <button class="h-btn" id="btn-edit">✏️ 编辑</button>
    </div>
    <p id="app-sub"></p>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="trip" class="on"><span class="ic">🗓️</span>行程</button>
    <button data-tab="transport"><span class="ic">🚗</span>交通</button>
    <button data-tab="book"><span class="ic">📌</span>预约</button>
    <button data-tab="budget"><span class="ic">💰</span>花费</button>
    <button data-tab="tips"><span class="ic">💡</span>贴士</button>
  </nav>
  <main id="main"></main>
</div>

<div class="mask" id="mask">
  <div class="sheet">
    <button class="x" id="sheet-close">✕</button>
    <h3 id="sheet-title">数据管理</h3>
    <button id="act-copy">📋 复制分享文本（发微信/备忘录）</button>
    <button id="act-export">⬇️ 导出备份 JSON 文件</button>
    <button id="act-import">⬆️ 导入备份 JSON 文件</button>
    <button id="act-share">📤 导出 data.json（更新网址用）</button>
    <button id="act-pull">🌐 从线上拉取最新攻略</button>
    <button id="act-reset">🔄 恢复为默认攻略</button>
    <div class="note" style="margin-top:4px;font-size:11.5px;color:#6b7280">💡 想让别人改的内容同步到网址？改好后点「导出 data.json」，把该文件上传到 GitHub 仓库根目录（Add file → Upload files），等约1分钟，所有人打开网址就是新版；不便操作可直接把 data.json 发给 Codex 代传。</div>
  </div>
</div>
<input type="file" id="file-import" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

var state, editing=false, tab='trip';

function load(){var d=JSON.parse(JSON.stringify(DEFAULT));try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.meta){if(!o.map)o.map=d.map;return o;}}}catch(e){}return d;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function $id(x){return document.getElementById(x);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function catName(c){return {tra:'交通',sight:'景点',food:'美食',shop:'购物',stay:'住宿',move:'移动'}[c]||c;}
function catTag(c){return '<span class="tag t-'+c+'">'+catName(c)+'</span>';}
function toast(msg){var t=$id('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},1800);}


function polySvg(seg,pts,color,w,dash){
  var d='';
  seg.route.forEach(function(n,i){var p=pts[n];d+=(i?'L':'M')+p[0]+' '+p[1]+' ';});
  return '<path d="'+d.trim()+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
}
function mapSvg(segIdx,isTotal){
  var m=state.map||DEFAULT.map,pts=m.points,W=920,H=880,names=Object.keys(pts);
  var h='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;background:#fffdf9;border-radius:10px">';
  h+='<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="12" fill="#fffdf9"/>';
  if(isTotal){
    h+='<path d="M575 150 L530 215 L490 280 L460 340 L452 372" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6 5"/>';
    h+='<text x="462" y="398" font-size="12" fill="#3b82f6">额尔古纳河（中俄界河）</text>';
    h+='<text x="812" y="148" font-size="20" fill="#9ca3af">俄</text><text x="812" y="172" font-size="20" fill="#9ca3af">罗</text><text x="812" y="196" font-size="20" fill="#9ca3af">斯</text>';
    h+='<text x="300" y="660" font-size="15" fill="#84cc16" opacity=".85">呼伦贝尔草原</text>';
    h+='<text x="24" y="40" font-size="15" font-weight="600" fill="#374151">7天总路线 · 全程约1800km</text>';
    h+='<text x="24" y="62" font-size="12" fill="#6b7280">海拉尔出发 → 阿尔山结束（示意图，非精确比例）</text>';
  } else {
    var cur=m.segments[segIdx];
    h+='<text x="24" y="40" font-size="14" font-weight="600" fill="'+cur.color+'">'+cur.label+' · '+cur.km+'</text>';
  }
  h+='<g opacity=".3">';
  m.segments.forEach(function(s){h+=polySvg(s,pts,'#9ca3af',3,s.dash||null);});
  h+='</g>';
  if(isTotal){m.segments.forEach(function(s){h+=polySvg(s,pts,s.color,5,s.dash||null);});}
  else{var cur2=m.segments[segIdx];h+=polySvg(cur2,pts,cur2.color,5,cur2.dash||null);}
  var startN=(isTotal?m.segments[0]:m.segments[segIdx]).route[0];
  var endSeg=isTotal?m.segments[m.segments.length-1]:m.segments[segIdx];
  var endN=endSeg.route[endSeg.route.length-1];
  names.forEach(function(n){
    var p=pts[n];
    h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#6b7280" stroke-width="2"/>';
    if(p[0]>750){h+='<text x="'+(p[0]-9)+'" y="'+(p[1]+4)+'" font-size="13" fill="#374151" text-anchor="end">'+n+'</text>';}
    else{h+='<text x="'+(p[0]+9)+'" y="'+(p[1]+4)+'" font-size="13" fill="#374151">'+n+'</text>';}
  });
  var sp=pts[startN],ep=pts[endN];
  if(startN!==endN)h+='<circle cx="'+sp[0]+'" cy="'+sp[1]+'" r="11" fill="#16a34a" stroke="#fff" stroke-width="2.5"/><text x="'+sp[0]+'" y="'+(sp[1]+4)+'" font-size="11" fill="#fff" text-anchor="middle">起</text>';
  h+='<circle cx="'+ep[0]+'" cy="'+ep[1]+'" r="11" fill="#dc2626" stroke="#fff" stroke-width="2.5"/><text x="'+ep[0]+'" y="'+(ep[1]+4)+'" font-size="11" fill="#fff" text-anchor="middle">终</text>';
  if(isTotal){
    var lx=24;
    m.segments.forEach(function(sg,i){
      h+='<line x1="'+lx+'" x2="'+(lx+36)+'" y1="816" y2="816" stroke="'+sg.color+'" stroke-width="5" stroke-linecap="round"/>';
      h+='<text x="'+(lx+42)+'" y="821" font-size="12" fill="#374151">'+(i+1)+'</text>';
      lx+=78;
    });
  }
  h+='</svg>';
  return h;
}

function render(){
  $id('app-title').textContent=state.meta.title;
  $id('app-sub').textContent=state.meta.sub;
  var be=$id('btn-edit');
  be.textContent=editing?'✔️ 完成':'✏️ 编辑';
  be.classList.toggle('on',editing);
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab);});
  if(tab==='trip')renderTrip();else if(tab==='transport')renderTransport();
  else if(tab==='book')renderBook();else if(tab==='budget')renderBudget();else renderTips();
}

  }
  h+='</ul>';
  if(editing)h+='<button class="add-btn" data-act="tipadd">＋ 添加贴士</button>';
  h+='</div>';
  $id('main').innerHTML=h;
}

function countItems(){return state.days.reduce(function(n,d){return n+d.items.length;},0);}

/* ---------- actions ---------- */
function updown(di,ii,dir){
  var d=state.days[di],arr=d.items,ni=ii+dir;
  if(ni<0||ni>=arr.length)return;
  var t=arr[ii];arr[ii]=arr[ni];arr[ni]=t;save();render();
}
function delItem(di,ii){state.days[di].items.splice(ii,1);save();render();}
function addItem(di){state.days[di].items.push({time:'00:00',title:'新安排',desc:'',cat:'move'});save();render();}
function addDay(){state.days.push({id:'d'+Date.now(),name:'DAY '+(state.days.length+1),date:'新日期',tagline:'',theme:'',cls:'d4',items:[{time:'00:00',title:'新安排',desc:'',cat:'move'}]});save();render();}
function delDay(di){state.days.splice(di,1);save();render();}

function makeShareText(){
  var L=[];var m=state.meta;
  L.push('【'+m.title+'】','📅 '+m.sub,'');
  L.push('🚗 去程：'+state.transport.outbound.lines.join('；'));
  L.push('🚗 返程：'+state.transport.ret.lines.join('；'));
  L.push('🗺️ 路线：'+state.transport.route,'');
  state.days.forEach(function(d){
    L.push('— '+d.name+'（'+d.date+'·'+d.theme+'）—');
    d.items.forEach(function(it){L.push('  '+it.time+' '+it.title+(it.desc?'：'+it.desc:''));});
    L.push('');
  });
  L.push('📌 预约待办：');
  state.bookings.forEach(function(b){if(!b.done)L.push('  □ '+(b.urgent?'[紧急] ':'')+b.text);});
  L.push('','💰 主要花费：');
  state.budget.forEach(function(r){L.push('  '+r.name+'：'+r.price+'（'+r.note+'）');});
  return L.join('\n');
}

/* ---------- events ---------- */
function wire(){
  $id('btn-edit').addEventListener('click',function(){editing=!editing;render();});
  $id('btn-data').addEventListener('click',function(){$id('mask').classList.add('show');});
  $id('sheet-close').addEventListener('click',function(){$id('mask').classList.remove('show');});
  $id('mask').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click',function(){tab=b.dataset.tab;render();});
  });

  $id('act-copy').addEventListener('click',function(){
    var txt=makeShareText();
    function ok(){toast('已复制，去微信/备忘录粘贴吧');$id('mask').classList.remove('show');}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok,function(){fallbackCopy(txt,ok);});
    }else fallbackCopy(txt,ok);
  });
  $id('act-export').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=(state.meta.title||'旅游攻略').replace(/[\\/:*?"<>|]/g,'-')+'备份.json';a.click();URL.revokeObjectURL(a.href);
    toast('已导出备份文件');$id('mask').classList.remove('show');
  });
  $id('act-import').addEventListener('click',function(){$id('file-import').click();$id('mask').classList.remove('show');});
  $id('file-import').addEventListener('change',function(){
    var f=this.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{var o=JSON.parse(rd.result);if(!o.meta)throw 0;
        state=o;save();render();toast('导入成功 ✓');}catch(e){toast('文件格式不对');}
    };
    rd.readAsText(f);this.value='';
  });
  $id('act-share').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();URL.revokeObjectURL(a.href);
    toast('已导出 data.json（上传到仓库即可更新网址）');$id('mask').classList.remove('show');
  });
  $id('act-pull').addEventListener('click',function(){
    fetch('data.json?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
      if(!d||!d.meta||!d.days)throw 0;
      state=JSON.parse(JSON.stringify(d));if(!state.map)state.map=JSON.parse(JSON.stringify(DEFAULT.map));
      save();render();toast('已更新为线上最新版');$id('mask').classList.remove('show');
    }).catch(function(){toast('线上暂无可拉取的数据');});
  });
  $id('act-reset').addEventListener('click',function(){
    if(confirm('确定恢复为默认攻略？当前所有修改将被清空。')){
      state=JSON.parse(JSON.stringify(DEFAULT));save();render();
      toast('已恢复默认攻略');$id('mask').classList.remove('show');
    }
  });

  $id('main').addEventListener('click',function(e){
    var t=e.target.closest('[data-act]');
    if(!t)return;
    var act=t.dataset.act,di=+t.dataset.day,ii=+t.dataset.idx;
    if(act==='up')updown(di,ii,-1);
    else if(act==='down')updown(di,ii,1);
    else if(act==='del')delItem(di,ii);
    else if(act==='additem')addItem(di);
    else if(act==='delday'){if(confirm('删除这一天？'))delDay(di);}
    else if(act==='addday')addDay();
    else if(act==='bk'){state.bookings[ii].done=t.checked;save();render();}
    else if(act==='bkurg'){state.bookings[ii].urgent=!state.bookings[ii].urgent;save();render();}
    else if(act==='bkdel'){state.bookings.splice(ii,1);save();render();}
    else if(act==='bkadd'){state.bookings.push({text:'新待办',done:false,urgent:false});save();render();}
    else if(act==='budel'){state.budget.splice(ii,1);save();render();}
    else if(act==='buadd'){state.budget.push({name:'新项目',price:'0',note:''});save();render();}
    else if(act==='tipdel'){state.tips.splice(ii,1);save();render();}
    else if(act==='tipadd'){state.tips.push('新贴士');save();render();}
  });

  $id('main').addEventListener('input',function(e){
    var t=e.target;if(!t.dataset||(!t.dataset.f&&!t.dataset.meta))return;
    var f=t.dataset.f;
    if(t.dataset.meta){state.meta[t.dataset.meta]=t.value;$id('app-title').textContent=state.meta.title;$id('app-sub').textContent=state.meta.sub;}
    else if(t.dataset.day!==undefined){
      var d=state.days[+t.dataset.day];
      if(t.dataset.idx!==undefined){d.items[+t.dataset.idx][f]=t.value;}
      else d[f]=t.value;
    }
    else if(t.dataset.tr!==undefined){
      if(f==='lines'){state.transport[t.dataset.tr].lines=t.value.split('\n');}
      else state.transport[t.dataset.tr][f]=t.value;
    }
    else if(t.dataset.bk!==undefined){state.bookings[+t.dataset.bk][f]=t.value;}
    else if(t.dataset.bu!==undefined){state.budget[+t.dataset.bu][f]=t.value;}
    else if(t.dataset.tip!==undefined){state.tips[+t.dataset.tip]=t.value;}
    save();
  });
}

function fallbackCopy(txt,ok){
  var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');ok();}catch(e){toast('复制失败，请手动长按选择复制');}
  document.body.removeChild(ta);
}

/* ---------- boot ---------- */
state=load();
wire();
render();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
function seedOnline(){
  return fetch('data.json?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    if(!d||!d.meta||!d.days)throw 0;
    var had=false;try{had=!!localStorage.getItem(KEY);}catch(e){}
    if(!had){state=JSON.parse(JSON.stringify(d));if(!state.map)state.map=JSON.parse(JSON.stringify(DEFAULT.map));save();render();toast('已载入线上最新攻略');}
  }).catch(function(){});
}
seedOnline();
})();
</script>
</body>
</html>
